name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: End-to-end on kind
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_VERSION: v0.30.0
    steps:
      - uses: actions/checkout@v4

      # The cluster runs inside this runner: kind builds it out of containers on
      # the runner's own Docker daemon, so no external or publicly reachable
      # cluster is involved. docker, kubectl, helm and openssl are preinstalled
      # on the runner image; kind is not.
      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      # KEEP=1 leaves the cluster up so the failure diagnostics below have
      # something to read. The runner is discarded either way.
      - name: Run the end-to-end suite
        run: KEEP=1 ./hack/e2e.sh

      # Debugging a red CI run is otherwise blind: the relay explains every
      # denial in its audit log, and that log is the fastest way to tell a
      # genuine regression from a broken fixture.
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          KCTX=kind-proxy-relay-e2e
          echo "::group::pods"
          kubectl --context "$KCTX" get pods -A -o wide
          echo "::endgroup::"
          echo "::group::relay logs"
          kubectl --context "$KCTX" -n relay-system logs deploy/relay --tail=200
          echo "::endgroup::"
          echo "::group::corporate proxy logs"
          kubectl --context "$KCTX" -n relay-system logs deploy/corp-proxy --tail=100
          echo "::endgroup::"
          echo "::group::policy"
          kubectl --context "$KCTX" get egresspolicies,upstreamproxies -o yaml
          echo "::endgroup::"
          echo "::group::events"
          kubectl --context "$KCTX" get events -A --sort-by=.lastTimestamp | tail -50
          echo "::endgroup::"

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name proxy-relay-e2e || true
