apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "relay.selectorLabels" . | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.service.port }}
      targetPort: proxy
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
