{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relay.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.allowedNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # Scraping and preflight reach the admin port only.
    - ports:
        - protocol: TCP
          port: {{ .Values.service.adminPort }}
{{- end }}
